<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Do You Still Love Me?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#050814;
    --night-2:#0d1230;
    --night-3:#170f3d;
    --rose:#ff8fab;
    --rose-deep:#e85d8a;
    --gold:#f4c95d;
    --cream:#fdf6f2;
    --mauve:#4a2b45;
    --sorry-red:#ff2b3f;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:var(--night-1);
    font-family:'Quicksand', sans-serif;
  }

  /* ---------- Ambient background: screen 1 (starry night + aurora) ---------- */
  .bg{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 25% 15%, rgba(255,143,171,0.14), transparent 42%),
      radial-gradient(ellipse at 78% 78%, rgba(244,201,93,0.10), transparent 45%),
      radial-gradient(ellipse at 50% 100%, rgba(101,72,199,0.28), transparent 60%),
      linear-gradient(165deg, var(--night-1) 0%, var(--night-2) 50%, var(--night-3) 100%);
    z-index:0;
    animation:auroraShift 16s ease-in-out infinite alternate;
  }
  @keyframes auroraShift{
    0%{ filter:hue-rotate(0deg) brightness(1); }
    100%{ filter:hue-rotate(8deg) brightness(1.06); }
  }

  .star{
    position:fixed;
    border-radius:50%;
    background:#ffffff;
    z-index:1;
    pointer-events:none;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0.15; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1.15); }
  }

  .glow-particle{
    position:fixed;
    bottom:-8%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,143,171,0.9), rgba(255,143,171,0) 70%);
    z-index:1;
    pointer-events:none;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    12%{ opacity:0.6; }
    100%{ transform:translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* ---------- Screens ---------- */
  .screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:5;
    opacity:1;
    visibility:visible;
    transition:opacity 0.9s ease, visibility 0.9s ease;
  }
  .screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  /* ---------- Screen 1: The question ---------- */
  .card{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(14px, 2.5vh, 24px);
    padding: clamp(24px, 4vw, 48px);
    width:min(92vw, 480px);
    text-align:center;
  }

  .upload-circle{
    width:clamp(120px, 22vw, 170px);
    height:clamp(120px, 22vw, 170px);
    border-radius:50%;
    border:2px dashed rgba(244,201,93,0.55);
    background:rgba(255,255,255,0.03);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    overflow:hidden;
    position:relative;
    transition:border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow:0 0 0 rgba(255,143,171,0);
  }
  .upload-circle:hover{
    border-color:var(--rose);
    transform:scale(1.03);
    box-shadow:0 0 28px rgba(255,143,171,0.25);
  }
  .upload-circle img{
    width:100%; height:100%; object-fit:cover;
  }
  .upload-hint{
    font-size:0.72rem;
    color:rgba(253,246,242,0.65);
    line-height:1.3;
    padding:0 10px;
  }
  .upload-circle input[type="file"]{
    position:absolute; inset:0;
    opacity:0; cursor:pointer; width:100%; height:100%;
  }
  .change-photo{
    font-size:0.7rem;
    color:rgba(253,246,242,0.5);
    letter-spacing:0.03em;
    margin-top:-6px;
  }

  .question{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    color:var(--cream);
    font-size:clamp(1.6rem, 5vw, 2.6rem);
    line-height:1.25;
    text-shadow:0 2px 24px rgba(255,143,171,0.25);
    margin:0;
  }
  .question .accent{
    color:var(--rose);
    font-style:normal;
    font-weight:700;
  }

  .btn-row{
    position:relative;
    display:flex;
    gap:22px;
    align-items:center;
    justify-content:center;
    height:70px;
    width:100%;
  }

  .btn{
    border:none;
    border-radius:999px;
    padding:14px 30px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.25s ease, left 0.28s ease, top 0.28s ease, font-size 0.2s ease;
  }

  .btn-yes{
    background:linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
    color:#2a0f1c;
    box-shadow:0 8px 22px rgba(232,93,138,0.35);
  }
  .btn-yes:hover{ transform:translateY(-2px) scale(1.04); box-shadow:0 12px 28px rgba(232,93,138,0.45); }
  .btn-yes:active{ transform:translateY(0) scale(0.98); }

  .btn-no{
    background:rgba(255,255,255,0.06);
    color:var(--cream);
    border:1.5px solid rgba(253,246,242,0.35);
    position:relative;
  }
  .btn-no.dodging{
    position:fixed;
  }

  .helper-text{
    font-size:0.78rem;
    color:rgba(253,246,242,0.45);
    margin-top:2px;
    min-height:1em;
  }

  /* ---------- Screen 2: The apology (pure black) ---------- */
  #screen-sorry{
    background:#000000;
  }
  .finale{
    position:relative;
    z-index:10;
    text-align:center;
    padding:2.2rem 6vw 2.6rem;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-radius:24px;
    max-width:min(90vw, 780px);
  }
  .finale h1{
    font-family:'Playfair Display', serif;
    font-weight:700;
    margin:0;
    font-size:clamp(2rem, 7vw, 4.4rem);
    line-height:1.22;
    letter-spacing:0.01em;

    background:linear-gradient(100deg,
      #ffffff 0%, #ffffff 22%,
      var(--sorry-red) 40%, var(--sorry-red) 55%,
      var(--gold) 68%,
      #ffffff 85%, #ffffff 100%);
    background-size:260% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:drop-shadow(0 0 18px rgba(255,43,63,0.45)) drop-shadow(0 0 34px rgba(255,255,255,0.12));
    animation:riseIn 1.2s cubic-bezier(.2,.9,.25,1) both, shimmer 5s linear 1.2s infinite;
  }
  .finale .signature{
    margin-top:20px;
    font-family:'Playfair Display', serif;
    font-style:italic;
    color:var(--gold);
    font-size:clamp(1rem, 2.6vw, 1.4rem);
    opacity:0;
    animation:riseIn 1.3s ease 0.7s both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(24px) scale(0.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes shimmer{
    0%{ background-position:0% 50%; }
    100%{ background-position:-260% 50%; }
  }

  /* Falling SORRY letters — straight down only, bold white with red accents */
  .fall-layer{
    position:fixed; inset:0;
    overflow:hidden;
    z-index:6;
    pointer-events:none;
  }
  .falling-word{
    position:absolute;
    top:-8%;
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-style:normal;
    white-space:nowrap;
    color:#ffffff;
    text-shadow:0 0 10px rgba(255,255,255,0.35);
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    will-change:transform;
  }
  .falling-word.is-red{
    color:var(--sorry-red);
    text-shadow:0 0 14px rgba(255,43,63,0.65);
  }
  @keyframes fall{
    0%{ transform:translateY(0); }
    100%{ transform:translateY(115vh); }
  }

  @media (max-width:420px){
    .btn{ padding:12px 22px; font-size:0.92rem; }
    .btn-row{ gap:14px; }
  }

  .sr-only{
    position:absolute; width:1px;height:1px;
    padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>

<div class="bg"></div>
<div id="stars-container"></div>
<div id="particles-container"></div>

<!-- SCREEN 1 : THE QUESTION -->
<section class="screen" id="screen-question">
  <div class="card">

    <div class="upload-circle">
    <img src="mygif.gif" alt="Anu">
    </div>
    <h1 class="question">Do You Still <span class="accent">Love</span> Me?</h1>

    <div class="btn-row" id="btnRow">
      <button class="btn btn-yes" id="yesBtn">Yes, Always 💗</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>

    <p class="helper-text" id="helperText">&nbsp;</p>
  </div>
</section>

<!-- SCREEN 2 : THE APOLOGY -->
<section class="screen hidden" id="screen-sorry">
  <div class="fall-layer" id="fallLayer"></div>
  <div class="finale">
    <h1>I'm So Sorry,<br>My Dear Ammu♡.<br>I Love You Soo Much! 💗</h1>
    <div class="signature">— forever yours, always sorry, always in love —</div>
  </div>
</section>

<script>
  /* ---------------- Twinkling stars on screen 1 ---------------- */
  const starsContainer = document.getElementById('stars-container');
  const STAR_COUNT = 90;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('span');
    s.className = 'star';
    const size = (Math.random()*2.2 + 1).toFixed(1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDuration = (2 + Math.random()*4) + 's';
    s.style.animationDelay = (Math.random()*5) + 's';
    starsContainer.appendChild(s);
  }

  /* ---------------- Soft rising glow particles on screen 1 ---------------- */
  const particlesContainer = document.getElementById('particles-container');
  const PARTICLE_COUNT = 14;
  for(let i=0;i<PARTICLE_COUNT;i++){
    const p = document.createElement('span');
    p.className = 'glow-particle';
    const size = (Math.random()*5 + 3).toFixed(1);
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random()*100 + 'vw';
    p.style.setProperty('--drift', (Math.random()*60 - 30) + 'px');
    p.style.animationDuration = (10 + Math.random()*12) + 's';
    p.style.animationDelay = (Math.random()*12) + 's';
    particlesContainer.appendChild(p);
  }


  /* ---------------- The dodging "No" button ---------------- */
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const btnRow = document.getElementById('btnRow');
  const helperText = document.getElementById('helperText');

  const noPhrases = [
    'No', 'Are you sure?', 'Really?', 'Think again...',
    'Please don\u2019t', 'Last chance', 'Don\u2019t do this', 'Nooo 🥺', 'Catch me first'
  ];
  let dodgeCount = 0;
  let yesScale = 1;

  function moveNoButton(){
    dodgeCount++;

    // Switch to fixed positioning across the whole viewport once dodging starts
    if(!noBtn.classList.contains('dodging')){
      const rect = noBtn.getBoundingClientRect();
      noBtn.classList.add('dodging');
      noBtn.style.left = rect.left + 'px';
      noBtn.style.top = rect.top + 'px';
      noBtn.style.margin = '0';
    }

    const margin = 16;
    const btnW = noBtn.offsetWidth || 110;
    const btnH = noBtn.offsetHeight || 50;
    const maxX = window.innerWidth - btnW - margin;
    const maxY = window.innerHeight - btnH - margin;

    const newX = Math.max(margin, Math.random() * maxX);
    const newY = Math.max(margin, Math.random() * maxY);

    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';

    // change its plea each time, cycling phrases
    noBtn.textContent = noPhrases[Math.min(dodgeCount, noPhrases.length - 1)];

    // yes button grows a little, gently, with a cap
    yesScale = Math.min(1.5, 1 + dodgeCount * 0.045);
    yesBtn.style.transform = `scale(${yesScale})`;

    helperText.textContent = dodgeCount < 3
      ? 'Hmm, seems like "No" doesn\u2019t want to be clicked.'
      : 'Face it \u2014 the answer is Yes 💗';
  }

  noBtn.addEventListener('mouseenter', moveNoButton);
  noBtn.addEventListener('focus', moveNoButton);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); }, {passive:false});
  noBtn.addEventListener('click', (e) => { e.preventDefault(); moveNoButton(); });

  /* ---------------- Yes button: transition to apology screen ---------------- */
  const screenQuestion = document.getElementById('screen-question');
  const screenSorry = document.getElementById('screen-sorry');
  const fallLayer = document.getElementById('fallLayer');

  function spawnFallingLetters(){
    const count = 140;
    for(let i=0;i<count;i++){
      const el = document.createElement('span');
      el.className = 'falling-word';
      if(Math.random() < 0.25) el.classList.add('is-red');
      el.textContent = 'SORRY';
      el.style.left = Math.random()*100 + 'vw';
      el.style.fontSize = (0.55 + Math.random()*0.55) + 'rem';
      el.style.opacity = (0.45 + Math.random()*0.5).toFixed(2);
      el.style.animationDuration = (4 + Math.random()*6) + 's';
      el.style.animationDelay = (Math.random()*5) + 's';
      fallLayer.appendChild(el);
    }
  }

  yesBtn.addEventListener('click', () => {
    screenQuestion.classList.add('hidden');
    screenSorry.classList.remove('hidden');
    spawnFallingLetters();
  });
</script>

</body>
</html>
