<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>For Anu 💗</title>

<!--
  =====================================================================
  HOW TO ADD YOUR OWN MEDIA (read this first!)
  =====================================================================
  Put these files in the SAME FOLDER as this index.html file, using
  these exact names — the page will pick them up automatically:

    her-gif.gif        -> the big gif for the "do you still love me" page
    photo1.jpg          -> gallery photo 1
    photo2.jpg          -> gallery photo 2
    photo3.jpg          -> gallery photo 3
    photo4.jpg          -> gallery photo 4  (add/remove <img class="gallery-photo"> tags below if you have more/fewer)
    voice-note.mp3       -> your voice note (plays after she taps YES)

  You can rename files or use .png/.jpeg/.mp4 etc — just update the
  "src" attributes marked with  <!-- REPLACE ME -->  comments below.

  The password is 1402 (hint: her birthdate, DD/MM). Change it by
  editing the CORRECT_PASSWORD constant near the bottom of the <script>.
  =====================================================================
-->

<style>
  :root{
    --maroon-deep:#1f0812;
    --maroon:#3a0d1f;
    --wine:#5c1330;
    --rose:#ff6f91;
    --rose-soft:#ffb6c9;
    --gold:#f4c95d;
    --cream:#fff3ec;
    --font-display:'Great Vibes', cursive;
    --font-serif:'Playfair Display', Georgia, serif;
    --font-body:'Cormorant Garamond', Georgia, serif;
  }

  @font-face{ /* fallback safety, but we import below */ }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    background:var(--maroon-deep);
    font-family:var(--font-body);
    color:var(--cream);
  }

  #app{
    position:relative;
    width:100%;
    height:100%;
  }

  .screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    overflow:hidden;
  }
  .screen.active{ display:flex; }

  /* ---------- ambient romantic background used on multiple screens ---------- */
  .bg-gradient{
    position:absolute;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,111,145,.25), transparent 55%),
      radial-gradient(ellipse at 80% 75%, rgba(244,201,93,.15), transparent 50%),
      linear-gradient(160deg, var(--maroon-deep), var(--maroon) 45%, var(--wine) 100%);
  }

  .content{ position:relative; z-index:2; width:100%; max-width:560px; }

  /* floating hearts / particles */
  .particles{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .particle{
    position:absolute;
    bottom:-10%;
    font-size:20px;
    color:var(--rose);
    opacity:.55;
    animation:floatUp linear infinite;
    filter:drop-shadow(0 0 6px rgba(255,111,145,.5));
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.6; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(360deg); opacity:0; }
  }

  h1,h2,h3{ font-family:var(--font-serif); font-weight:600; letter-spacing:.02em; }

  /* ================= SCREEN 1: PASSWORD ================= */
  #screen-password .content{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .lock-icon{ font-size:44px; filter:drop-shadow(0 0 12px rgba(255,111,145,.6)); }
  .title-script{
    font-family:var(--font-display);
    font-size:clamp(40px, 10vw, 64px);
    color:var(--rose-soft);
    text-shadow:0 0 18px rgba(255,111,145,.5);
    line-height:1.1;
  }
  .subtitle{ font-size:clamp(15px,4vw,18px); color:var(--cream); opacity:.85; font-style:italic; }

  .pw-input{
    width:100%;
    max-width:280px;
    padding:14px 18px;
    font-size:22px;
    letter-spacing:8px;
    text-align:center;
    border-radius:14px;
    border:1.5px solid rgba(255,182,201,.4);
    background:rgba(255,255,255,.06);
    color:var(--cream);
    outline:none;
    font-family:var(--font-body);
  }
  .pw-input:focus{ border-color:var(--rose); box-shadow:0 0 0 3px rgba(255,111,145,.2); }
  .pw-input.shake{ animation:shake .4s; }
  @keyframes shake{
    20%,60%{ transform:translateX(-8px); }
    40%,80%{ transform:translateX(8px); }
  }

  .btn{
    font-family:var(--font-serif);
    font-size:17px;
    padding:12px 34px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    background:linear-gradient(135deg, var(--rose), #d94f75);
    color:#fff;
    box-shadow:0 8px 24px rgba(255,111,145,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 10px 28px rgba(255,111,145,.5); }
  .btn:active{ transform:translateY(0) scale(.98); }

  .pw-hint{ font-size:14px; color:var(--gold); opacity:.85; }
  .pw-error{ font-size:14px; color:#ff9db3; min-height:18px; }

  /* ================= SCREEN 2: DO YOU LOVE ME ================= */
  #screen-love .content{ display:flex; flex-direction:column; align-items:center; gap:22px; }
  .gif-frame{
    width:min(92vw, 420px);
    border-radius:22px;
    overflow:hidden;
    border:3px solid rgba(255,182,201,.5);
    box-shadow:0 18px 50px rgba(0,0,0,.5), 0 0 40px rgba(255,111,145,.25);
    background:rgba(255,255,255,.04);
  }
  .gif-frame img{ width:100%; display:block; }
  .love-question{ font-family:var(--font-serif); font-size:clamp(24px,6vw,34px); color:var(--cream); }
  .choice-row{
    position:relative;
    display:flex;
    gap:22px;
    justify-content:center;
    align-items:center;
    width:100%;
    min-height:70px;
  }
  #btnNo{
    background:linear-gradient(135deg,#7a7a7a,#4d4d4d);
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    position:relative;
    transition:transform .18s ease;
  }
  #btnNo.escaping{ position:fixed; z-index:50; }

  /* ================= SCREEN 3: GALLERY + VOICE NOTE ================= */
  #screen-gallery{ overflow-y:auto; padding-top:50px; padding-bottom:50px; }
  .falling-hearts{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .fh{
    position:absolute;
    top:-8%;
    color:var(--rose);
    opacity:.8;
    animation:fallDown linear infinite;
    filter:drop-shadow(0 0 6px rgba(255,111,145,.6));
  }
  @keyframes fallDown{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(115vh) rotate(360deg); }
  }
  .gallery-title{ font-family:var(--font-display); font-size:clamp(38px,9vw,54px); color:var(--rose-soft); margin-bottom:6px; }
  .gallery-sub{ font-size:15px; opacity:.8; margin-bottom:24px; font-style:italic;}
  .gallery-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
  }
  .gallery-photo{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:16px;
    border:2px solid rgba(255,182,201,.4);
    box-shadow:0 10px 26px rgba(0,0,0,.4);
    background:rgba(255,255,255,.05);
  }
  .voice-fallback{
    margin-top:22px;
    font-size:14px;
    color:var(--gold);
    cursor:pointer;
    text-decoration:underline;
    background:none;
    border:none;
    font-family:var(--font-body);
  }
  .go-next-wrap{ margin-top:32px; }

  /* ================= SCREEN 4: CAKE ================= */
  #screen-cake{ transition:background .6s ease; }
  .cake-title{ font-family:var(--font-serif); font-size:clamp(20px,5.5vw,28px); margin-bottom:8px; }
  .cake-instructions{ font-size:14px; opacity:.8; margin-bottom:26px; font-style:italic;}
  .cake-wrap{ position:relative; }
  .cake-svg{ width:min(80vw,300px); }
  .candle-flame{ cursor:pointer; transition:opacity .25s ease, transform .25s ease; transform-origin:center bottom; }
  .candle-flame.out{ opacity:0; transform:scale(.3); }
  .flame-anim{ animation:flicker 1s ease-in-out infinite alternate; transform-origin:center bottom; }
  @keyframes flicker{
    0%{ transform:scaleY(1) rotate(-2deg); }
    100%{ transform:scaleY(1.12) rotate(2deg); }
  }
  .blackout{
    position:fixed; inset:0; background:#000; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .8s ease;
  }
  .blackout.show{ opacity:1; pointer-events:all; }

  .hb-letters{
    position:fixed; inset:0; z-index:101;
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:2px; padding:20px;
    opacity:0; pointer-events:none;
  }
  .hb-letters.show{ opacity:1; }
  .hb-letters span{
    font-family:var(--font-serif);
    font-size:clamp(22px,7vw,48px);
    color:var(--gold);
    opacity:0;
    text-shadow:0 0 18px rgba(244,201,93,.7);
    animation:letterPop .5s ease forwards;
  }
  @keyframes letterPop{
    from{ opacity:0; transform:translateY(14px) scale(.7); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  #fireworksCanvas{ position:fixed; inset:0; z-index:102; pointer-events:none; display:none; }
  .memorable-text{
    position:fixed; left:0; right:0; bottom:9%; z-index:103;
    text-align:center; padding:0 24px;
    font-family:var(--font-serif); font-style:italic;
    font-size:clamp(16px,4.2vw,22px); color:var(--cream);
    opacity:0; transition:opacity 1.2s ease;
  }
  .memorable-text.show{ opacity:1; }
  .continue-wrap{
    position:fixed; left:0; right:0; bottom:4%; z-index:103;
    display:flex; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 1s ease;
  }
  .continue-wrap.show{ opacity:1; pointer-events:all; }

  /* ================= SCREEN 5: FINAL MESSAGE ================= */
  #screen-message .btn{ font-size:19px; padding:16px 40px; }
  .msg-lead{ font-family:var(--font-display); font-size:clamp(34px,8vw,48px); color:var(--rose-soft); margin-bottom:26px;}

  #screen-finale{ background:#000; }
  .rain-wrap{ position:absolute; inset:0; overflow:hidden; z-index:1; }
  .rain-item{
    position:absolute; top:-5%; color:var(--rose);
    font-family:var(--font-serif); font-weight:600;
    opacity:.8; white-space:nowrap;
    animation:rainFall linear infinite;
  }
  @keyframes rainFall{
    0%{ transform:translateY(0); }
    100%{ transform:translateY(110vh); }
  }
  .finale-center{
    position:relative; z-index:2;
    font-family:var(--font-display);
    font-size:clamp(34px,9vw,72px);
    color:var(--gold);
    text-shadow:0 0 30px rgba(244,201,93,.8), 0 0 60px rgba(255,111,145,.5);
    animation:glowPulse 2.4s ease-in-out infinite;
    padding:0 16px;
  }
  @keyframes glowPulse{
    0%,100%{ text-shadow:0 0 20px rgba(244,201,93,.7), 0 0 40px rgba(255,111,145,.4); }
    50%{ text-shadow:0 0 40px rgba(244,201,93,1), 0 0 80px rgba(255,111,145,.7); }
  }

  .hidden-audio{ display:none; }
  .signature{ position:fixed; bottom:10px; right:14px; font-size:11px; opacity:.35; z-index:5; letter-spacing:.05em;}

  @media (prefers-reduced-motion: reduce){
    .particle, .fh, .rain-item, .flame-anim{ animation:none !important; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
</head>
<body>

<div id="app">

  <!-- ================= SCREEN 1: PASSWORD ================= -->
  <section id="screen-password" class="screen active">
    <div class="bg-gradient"></div>
    <div class="particles" id="particles1"></div>
    <div class="content">
      <div class="lock-icon">🔐</div>
      <div class="title-script">A little secret<br>just for you</div>
      <p class="subtitle">This page is locked with something only you'd know...</p>
      <input type="password" inputmode="numeric" maxlength="6" class="pw-input" id="pwInput" placeholder="• • • •" autocomplete="off">
      <p class="pw-error" id="pwError"></p>
      <button class="btn" id="pwSubmit">Unlock 💗</button>
      <p class="pw-hint">Hint: it's my birthday — day and month 🎂</p>
    </div>
  </section>

  <!-- ================= SCREEN 2: DO YOU STILL LOVE ME ================= -->
  <section id="screen-love" class="screen">
    <div class="bg-gradient"></div>
    <div class="particles" id="particles2"></div>
    <div class="content">
      <div class="gif-frame">
        <!-- REPLACE ME: put your gif file named her-gif.gif in this folder -->
        <img id="loveGif" src="her-gif.gif" alt="our moment"
             onerror="this.parentElement.innerHTML='<div style=\'padding:60px 20px;font-family:Cormorant Garamond;font-size:15px;opacity:.7\'>🎞️ Add a file named <b>her-gif.gif</b> next to this HTML file to see it here.</div>'">
      </div>
      <h2 class="love-question">Do you still love me? 🥺</h2>
      <div class="choice-row">
        <button class="btn" id="btnYes">Yes 💖</button>
        <button class="btn" id="btnNo">No</button>
      </div>
    </div>
  </section>

  <!-- ================= SCREEN 3: GALLERY + VOICE NOTE ================= -->
  <section id="screen-gallery" class="screen">
    <div class="bg-gradient"></div>
    <div class="falling-hearts" id="fallingHearts"></div>
    <div class="content">
      <h2 class="gallery-title">Us 💞</h2>
      <p class="gallery-sub">every little moment, worth keeping</p>
      <div class="gallery-grid">
        <!-- REPLACE ME: swap in your own photo files, add/remove tags as needed -->
        <img class="gallery-photo" src="photo1.jpg" alt="memory 1" onerror="this.style.display='none'">
        <img class="gallery-photo" src="photo2.jpg" alt="memory 2" onerror="this.style.display='none'">
        <img class="gallery-photo" src="photo3.jpg" alt="memory 3" onerror="this.style.display='none'">
        <img class="gallery-photo" src="photo4.jpg" alt="memory 4" onerror="this.style.display='none'">
      </div>
      <button class="voice-fallback" id="voicePlayBtn">🔊 tap to hear a little something from me</button>
      <!-- REPLACE ME: put your voice note named voice-note.mp3 in this folder -->
      <audio id="voiceNote" class="hidden-audio" src="voice-note.mp3" preload="auto"></audio>
      <div class="go-next-wrap">
        <button class="btn" id="toCakeBtn">Next 🎂</button>
      </div>
    </div>
  </section>

  <!-- ================= SCREEN 4: CAKE ================= -->
  <section id="screen-cake" class="screen">
    <div class="bg-gradient"></div>
    <div class="content">
      <h3 class="cake-title">Make a wish, Anu 🌙</h3>
      <p class="cake-instructions">tap each flame to blow out the candles</p>
      <div class="cake-wrap">
        <svg class="cake-svg" viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg">
          <!-- plate -->
          <ellipse cx="150" cy="235" rx="120" ry="14" fill="#5c1330" opacity=".6"/>
          <!-- bottom tier -->
          <rect x="40" y="170" width="220" height="60" rx="10" fill="#d94f75"/>
          <rect x="40" y="170" width="220" height="14" rx="6" fill="#ffb6c9"/>
          <!-- top tier -->
          <rect x="75" y="120" width="150" height="55" rx="10" fill="#ff6f91"/>
          <rect x="75" y="120" width="150" height="12" rx="6" fill="#ffdce6"/>
          <!-- drips -->
          <circle cx="100" cy="120" r="7" fill="#ffdce6"/>
          <circle cx="150" cy="118" r="8" fill="#ffdce6"/>
          <circle cx="200" cy="120" r="7" fill="#ffdce6"/>
          <!-- candles -->
          <g id="candle1">
            <rect x="100" y="95" width="7" height="26" fill="#f4c95d"/>
            <g class="candle-flame flame-anim" data-candle="1">
              <ellipse cx="103.5" cy="88" rx="6" ry="10" fill="#ffb347"/>
              <ellipse cx="103.5" cy="90" rx="3" ry="5.5" fill="#fff3ec"/>
            </g>
          </g>
          <g id="candle2">
            <rect x="146" y="88" width="7" height="33" fill="#f4c95d"/>
            <g class="candle-flame flame-anim" data-candle="2">
              <ellipse cx="149.5" cy="80" rx="6" ry="10" fill="#ffb347"/>
              <ellipse cx="149.5" cy="82" rx="3" ry="5.5" fill="#fff3ec"/>
            </g>
          </g>
          <g id="candle3">
            <rect x="192" y="95" width="7" height="26" fill="#f4c95d"/>
            <g class="candle-flame flame-anim" data-candle="3">
              <ellipse cx="195.5" cy="88" rx="6" ry="10" fill="#ffb347"/>
              <ellipse cx="195.5" cy="90" rx="3" ry="5.5" fill="#fff3ec"/>
            </g>
          </g>
        </svg>
      </div>
      <p style="margin-top:14px;font-size:13px;opacity:.6;" id="candleCounter">0 / 3 candles blown out</p>
    </div>
  </section>

  <!-- overlays for the cake reveal sequence -->
  <div class="blackout" id="blackout"></div>
  <div class="hb-letters" id="hbLetters"></div>
  <canvas id="fireworksCanvas"></canvas>
  <div class="memorable-text" id="memorableText">"Every year with you feels like the best one yet. Here's to more birthdays, more memories, and more us." 💛</div>
  <div class="continue-wrap" id="continueWrap">
    <button class="btn" id="toMessageBtn">Continue →</button>
  </div>

  <!-- ================= SCREEN 5: TARUN WANTS TO SAY SOMETHING ================= -->
  <section id="screen-message" class="screen">
    <div class="bg-gradient"></div>
    <div class="particles" id="particles5"></div>
    <div class="content">
      <p class="msg-lead">one more thing...</p>
      <button class="btn" id="toFinaleBtn">Tarun wants to say something 💌</button>
    </div>
  </section>

  <!-- ================= SCREEN 6: FINALE ================= -->
  <section id="screen-finale" class="screen">
    <div class="rain-wrap" id="rainWrap"></div>
    <div class="finale-center">I Love You<br>Anu Forever</div>
  </section>

  <div class="signature">made with 💗 by Tarun</div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- CONFIG ---------- */
  const CORRECT_PASSWORD = "1402"; // change this if you want a different password

  /* ---------- helpers ---------- */
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function makeParticles(containerId, count, symbol, sizeRange, durRange){
    const el = document.getElementById(containerId);
    if(!el) return;
    el.innerHTML = "";
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = symbol;
      const left = Math.random()*100;
      const size = sizeRange[0] + Math.random()*(sizeRange[1]-sizeRange[0]);
      const dur = durRange[0] + Math.random()*(durRange[1]-durRange[0]);
      const delay = Math.random()*dur;
      const drift = (Math.random()*80-40)+"px";
      p.style.left = left+"%";
      p.style.fontSize = size+"px";
      p.style.animationDuration = dur+"s";
      p.style.animationDelay = "-"+delay+"s";
      p.style.setProperty('--drift', drift);
      el.appendChild(p);
    }
  }

  /* =========================================================
     SCREEN 1 — PASSWORD
     ========================================================= */
  makeParticles('particles1', 18, '♥', [12,26], [7,14]);

  const pwInput = document.getElementById('pwInput');
  const pwSubmit = document.getElementById('pwSubmit');
  const pwError = document.getElementById('pwError');

  function tryUnlock(){
    if(pwInput.value.trim() === CORRECT_PASSWORD){
      pwError.textContent = "";
      goToLoveScreen();
    } else {
      pwError.textContent = "not quite... try again 💭";
      pwInput.classList.remove('shake');
      void pwInput.offsetWidth; // restart animation
      pwInput.classList.add('shake');
    }
  }
  pwSubmit.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

  function goToLoveScreen(){
    showScreen('screen-love');
    makeParticles('particles2', 14, '♥', [10,22], [8,15]);
  }

  /* =========================================================
     SCREEN 2 — DO YOU STILL LOVE ME
     ========================================================= */
  const btnNo = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');
  const choiceRow = document.querySelector('.choice-row');

  function dodgeNo(){
    const rowRect = choiceRow.getBoundingClientRect();
    const btnRect = btnNo.getBoundingClientRect();
    const maxX = window.innerWidth - btnRect.width - 16;
    const maxY = window.innerHeight - btnRect.height - 16;
    const newX = Math.max(16, Math.random()*maxX);
    const newY = Math.max(16, Math.random()*maxY);
    btnNo.classList.add('escaping');
    btnNo.style.left = newX+"px";
    btnNo.style.top = newY+"px";
  }
  btnNo.addEventListener('mouseenter', dodgeNo);
  btnNo.addEventListener('touchstart', function(e){ e.preventDefault(); dodgeNo(); }, {passive:false});
  btnNo.addEventListener('click', function(e){ e.preventDefault(); dodgeNo(); });

  btnYes.addEventListener('click', function(){
    showScreen('screen-gallery');
    spawnFallingHearts();
    // try to autoplay the voice note; browsers often block autoplay w/ sound,
    // so we also expose a manual play button as a fallback.
    const audio = document.getElementById('voiceNote');
    audio.play().catch(()=>{ /* autoplay blocked — user can tap the button */ });
  });

  /* =========================================================
     SCREEN 3 — GALLERY + VOICE NOTE
     ========================================================= */
  function spawnFallingHearts(){
    const el = document.getElementById('fallingHearts');
    el.innerHTML = "";
    const symbols = ['❤','💕','💗','💓'];
    for(let i=0;i<26;i++){
      const h = document.createElement('div');
      h.className = 'fh';
      h.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      h.style.left = (Math.random()*100)+"%";
      const size = 14 + Math.random()*18;
      h.style.fontSize = size+"px";
      const dur = 6 + Math.random()*8;
      h.style.animationDuration = dur+"s";
      h.style.animationDelay = "-"+(Math.random()*dur)+"s";
      el.appendChild(h);
    }
  }

  document.getElementById('voicePlayBtn').addEventListener('click', function(){
    const audio = document.getElementById('voiceNote');
    audio.currentTime = 0;
    audio.play().catch(()=>{});
  });

  document.getElementById('toCakeBtn').addEventListener('click', function(){
    showScreen('screen-cake');
  });

  /* =========================================================
     SCREEN 4 — CAKE / CANDLES / REVEAL SEQUENCE
     ========================================================= */
  let candlesOut = 0;
  const totalCandles = 3;
  const candleCounter = document.getElementById('candleCounter');

  document.querySelectorAll('.candle-flame').forEach(flame=>{
    flame.addEventListener('click', function(){ blowCandle(flame); });
    flame.addEventListener('touchstart', function(e){ e.preventDefault(); blowCandle(flame); }, {passive:false});
  });

  function blowCandle(flame){
    if(flame.classList.contains('out')) return;
    flame.classList.remove('flame-anim');
    flame.classList.add('out');
    candlesOut++;
    candleCounter.textContent = candlesOut + " / " + totalCandles + " candles blown out";
    if(candlesOut >= totalCandles){
      setTimeout(startRevealSequence, 500);
    }
  }

  // optional: try to detect a real "blow" via microphone as a bonus.
  // fails silently and just falls back to tapping if mic isn't available/allowed.
  (function tryMicBlow(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      function poll(){
        if(!document.getElementById('screen-cake').classList.contains('active')){
          requestAnimationFrame(poll); return;
        }
        analyser.getByteFrequencyData(data);
        let sum=0; for(let i=0;i<data.length;i++) sum+=data[i];
        const avg = sum/data.length;
        if(avg > 55){ // loud enough -> treat as a "blow"
          document.querySelectorAll('.candle-flame:not(.out)').forEach((f,idx)=>{
            if(idx===0) blowCandle(f);
          });
        }
        requestAnimationFrame(poll);
      }
      poll();
    }).catch(()=>{ /* mic denied — tapping still works fine */ });
  })();

  function startRevealSequence(){
    const blackout = document.getElementById('blackout');
    blackout.classList.add('show');
    setTimeout(()=>{
      revealHappyBirthday();
    }, 3500); // 3-4s black screen
  }

  function revealHappyBirthday(){
    const wrap = document.getElementById('hbLetters');
    const text = "Happy Birthday Anu!";
    wrap.innerHTML = "";
    [...text].forEach((ch, i)=>{
      const span = document.createElement('span');
      span.textContent = ch === " " ? "\u00A0" : ch;
      span.style.animationDelay = (i*0.09)+"s";
      wrap.appendChild(span);
    });
    wrap.classList.add('show');

    setTimeout(startFireworks, text.length*90 + 400);
  }

  /* ---- fireworks (canvas + synthesized boom sound) ---- */
  let audioCtx;
  function playBoom(){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      // low thump
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(40, now+0.35);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+0.4);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now+0.4);
      // sparkle noise
      const bufferSize = audioCtx.sampleRate*0.3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.15, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now+0.3);
      noise.connect(noiseGain); noiseGain.connect(audioCtx.destination);
      noise.start(now);
    }catch(e){ /* audio not available — fireworks still show visually */ }
  }

  function startFireworks(){
    const canvas = document.getElementById('fireworksCanvas');
    canvas.style.display = 'block';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    let particles = [];
    const colors = ['#ff6f91','#f4c95d','#ffb6c9','#fff3ec','#ff9db3'];

    function burst(x,y){
      playBoom();
      const count = 46;
      for(let i=0;i<count;i++){
        const angle = (Math.PI*2*i)/count;
        const speed = 2 + Math.random()*3.4;
        particles.push({
          x,y,
          vx: Math.cos(angle)*speed,
          vy: Math.sin(angle)*speed,
          life: 1,
          color: colors[Math.floor(Math.random()*colors.length)]
        });
      }
    }

    let running = true;
    function loop(){
      if(!running) return;
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{
        p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.life -= 0.014;
        ctx.globalAlpha = Math.max(p.life,0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,2.4,0,Math.PI*2);
        ctx.fill();
      });
      particles = particles.filter(p=>p.life>0);
      ctx.globalAlpha = 1;
      requestAnimationFrame(loop);
    }
    loop();

    let bursts = 0;
    const burstInterval = setInterval(()=>{
      burst(canvas.width*(0.2+Math.random()*0.6), canvas.height*(0.2+Math.random()*0.4));
      bursts++;
      if(bursts>=7){ clearInterval(burstInterval); }
    }, 550);

    // show memorable text partway through
    setTimeout(()=>{
      document.getElementById('memorableText').classList.add('show');
    }, 1600);

    // reveal continue button after fireworks settle
    setTimeout(()=>{
      running = false;
      canvas.style.display = 'none';
      document.getElementById('continueWrap').classList.add('show');
    }, 5200);
  }

  document.getElementById('toMessageBtn').addEventListener('click', function(){
    // clean up overlays
    document.getElementById('blackout').classList.remove('show');
    document.getElementById('hbLetters').classList.remove('show');
    document.getElementById('memorableText').classList.remove('show');
    document.getElementById('continueWrap').classList.remove('show');
    showScreen('screen-message');
    makeParticles('particles5', 12, '♥', [10,20], [8,14]);
  });

  /* =========================================================
     SCREEN 5 -> 6 — FINAL MESSAGE
     ========================================================= */
  document.getElementById('toFinaleBtn').addEventListener('click', function(){
    showScreen('screen-finale');
    spawnLoveRain();
  });

  function spawnLoveRain(){
    const wrap = document.getElementById('rainWrap');
    wrap.innerHTML = "";
    const count = 60;
    for(let i=0;i<count;i++){
      const item = document.createElement('div');
      item.className = 'rain-item';
      item.textContent = 'I LOVE YOU';
      item.style.left = (Math.random()*100)+"%";
      const size = 10 + Math.random()*16;
      item.style.fontSize = size+"px";
      item.style.opacity = (0.35 + Math.random()*0.5).toFixed(2);
      const dur = 5 + Math.random()*9;
      item.style.animationDuration = dur+"s";
      item.style.animationDelay = "-"+(Math.random()*dur)+"s";
      wrap.appendChild(item);
    }
  }

})();
</script>
</body>
</html>
